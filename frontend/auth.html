<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authentication — Trademark Arbitration DSS</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">
    <!-- Global Gold Cursor Follow Spotlight -->
    <div id="cursorGlow" class="cursor-glow" aria-hidden="true"></div>

    <div class="auth-container">
        <div class="auth-header reveal" style="--i: 0;">
            <h1>Trademark DSS</h1>
            <p>Arbitration Decision Support System Authentication</p>
        </div>

        <div class="auth-card reveal" style="--i: 1;">
            <div class="auth-tabs" role="tablist">
                <button type="button" class="auth-tab-btn active" id="tabLogin" role="tab" aria-selected="true">Sign In</button>
                <button type="button" class="auth-tab-btn" id="tabSignup" role="tab" aria-selected="false">Create Account</button>
            </div>

            <div id="authAlert" class="auth-alert" role="alert"></div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" required placeholder="counsel@lawfirm.in" autocomplete="email" />
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="Enter your password" autocomplete="current-password" />
                </div>
                <button type="submit" class="submit-btn" id="loginSubmitBtn">
                    Sign In to DSS
                </button>
            </form>

            <!-- Sign Up Form -->
            <form id="signupForm" class="auth-form hidden" novalidate>
                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" required placeholder="counsel@lawfirm.in" autocomplete="email" />
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password (min. 6 characters)</label>
                    <input type="password" id="signupPassword" required minlength="6" placeholder="Choose a secure password" autocomplete="new-password" />
                </div>
                <div class="form-group">
                    <label for="signupRole">Account Role</label>
                    <select id="signupRole" required>
                        <option value="lawyer">Lawyer / Legal Counsel</option>
                        <option value="company">Company / Brand Owner</option>
                        <option value="admin">Arbitration Administrator</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn" id="signupSubmitBtn">
                    Create Account
                </button>
            </form>

            <a href="/" class="auth-back-link">← Return to Dispute Dashboard</a>
        </div>
    </div>

    <script type="module" src="motion.js"></script>
    <script type="module" src="auth.js"></script>
</body>
</html>
